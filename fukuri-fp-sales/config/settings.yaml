# 株式会社スフェノス 福利厚生FP相談 法人開拓システム設定
# 数値目標は初期仮説。月次レポートの実績に基づき見直す。
targets:
  adopted_companies: 100
  covered_employees: 7500
  monthly_consultations: 100
  weekly_new_research: 50
  monthly_outreach: 200
  monthly_meetings: 15
  monthly_adoptions: 1

sender:            # 営業文面の差出人。実運用前に必ず記入する
  company: 株式会社スフェノス
  name: 小関 健太
  title: 代表取締役
  address: 〒180-0002 東京都武蔵野市吉祥寺東町3-1-8-201
  phone: "（電話番号）"
  email: info@sphenos.com
  website: https://sphenos.com/
  agency: 所属する保険代理店      # 対外文面では代理店名を出さない（社内の承認手続きは従来どおり必要）
  booking_base_url: "（予約ページのベースURL）"
  lp_url: ""             # 企業向け案内ページ（lp/index.html）の公開URL。設定するとフォーム文面に該当メニューへのリンクが入る
  # フォーム入力用（空欄可。空欄の項目が必須のフォームは手動対応になる）
  company_kana: ""
  name_kana: ""
  zip: 180-0002

compliance:
  # 所属代理店の承認が取れたら true にする。
  # false の間は Gmail 下書き作成・導入企業向け資料の正式版出力をブロックする。
  agency_approved: false
  agency_approval_date: ""
  agency_approval_ref: ""
  min_cell_size: 3        # 企業向けレポートでこの件数未満の内訳は秘匿

# 営業管理スプレッドシート（正本・1ファイルのみ）。環境変数 SFS_SPREADSHEET_ID があれば優先
spreadsheet_id: 1rLW4qsGlxP5BDTJSSMU-SihAqW5jAQy5ycTfd1RwpDo

# 主力商品：法人顧問FPサービス（有料）。文面・LPはこの定義を参照する
offer:
  name: 法人顧問FPサービス
  monthly_yen: 50000
  price_text: 月額5万円（税別・初年度）
  year2_text: 2年目以降は年額100万円（税別）
  year2_yen: 1000000
  includes:
    - 従業員とご家族の個別相談（回数無制限・オンライン／対面）
    - 年間の社内研修（新入社員研修・企業型DCの継続投資教育・定年前セミナーなどから選択）
    - ライフプラン表の作成
    - 利用状況のご報告（件数と傾向のみ。個人は特定されない形）
  goal: 従業員50〜100名の会社と10社の顧問契約

form_sales:
  offer: komon           # komon = 法人顧問FPサービスを案内／entry = 無料セミナー（入口提案）を案内
  # 誰の、どんな課題を、どう解決するか（一文）。営業文・リスト・商談で同じことを言う
  concept: 従業員の健康や定着に投資している50〜100名の会社に、社外の「お金の相談窓口」を月額5万円で提供し、従業員のお金の不安を減らして定着を支える
  min_score: 30          # フォーム営業の対象にする最低スコア（優先営業リストはBランク以上のみ）
  daily_max: 10          # 1日の送信上限（月200社＝営業日あたり約10社）
  min_interval_sec: 90   # 送信間隔
  max_chars: 700         # 本文の上限（署名・注記込み）

origin_station: 武蔵小金井
# 移動手段。car = 市区町村単位の車での概算所要時間（drive_minutes）で判定／transit = 駅別所要時間表＋徒歩
travel_mode: car
max_travel_minutes: 90
employee_range: {ideal_min: 50, ideal_max: 100, hard_min: 30, hard_max: 300}

