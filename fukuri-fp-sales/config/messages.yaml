# ---- 接点づくりの共通スクリプト（入口提案を問わず使う） ----
common:
  - channel: 紹介（既存の個人顧客）
    scene: 相談済みのお客様に、勤務先の総務・人事への一言をお願いする
    text: |
      ○○さん、いつもありがとうございます。一つお願いがあります。
      いま、会社の従業員向けに、給与明細や社会保険、老後資金の話をする無料のセミナーをお引き受けしています。
      ○○さんの会社でもお役に立てそうでしたら、総務か人事のご担当の方に「こういう人がいる」と
      一言お伝えいただけないでしょうか。ご紹介いただくだけで、その後のやり取りは私が直接行います。
      もちろん、○○さんのご相談内容を会社にお話しすることは一切ありません。難しければ遠慮なくおっしゃってください。
    note: 顧客の相談内容・契約の有無には一切触れない。断りやすい言い方にする。
  - channel: 紹介（社労士・税理士）
    scene: 面識のある士業に、顧問先への紹介または共催を依頼する
    text: |
      ○○先生、ご無沙汰しております。{{ me }}です。
      顧問先から「社員の定着」や「福利厚生」のご相談を受けられることはありますか。
      企業の従業員向けに、新入社員向けのお金の研修や、企業型DCの継続投資教育を無料でお引き受けしています。
      先生の顧問先サービスの一つとして使っていただける形にしたいと考えています。
      武蔵小金井から伺える範囲の、従業員50〜100名ほどの会社でお心当たりがあれば、1社ご紹介いただけないでしょうか。
      先生のお名前に傷がつかないよう、当日は商品の案内をしないことをお約束します。
    note: 紹介可能な企業が分かったら 07_士業・紹介パートナー に法人番号を登録する（優先順位が最上位になる）。
  - channel: 紹介（地域金融機関・商工会議所・法人会・同友会）
    scene: 会員企業向けセミナーの講師として登壇を申し出る
    text: |
      会員企業さま向けのセミナー講師として、次のテーマを無料でお引き受けできます。
      ・「賃上げ以外で社員の定着を高める——今の報酬の価値を伝える方法」（経営者・総務向け 60分）
      ・「企業型DCを導入した会社がやるべき継続投資教育」（総務・人事向け 60分）
      講師料・交通費は不要です。当日は金融商品のご案内はいたしません。
      次回の会員向けセミナーや例会のテーマ募集がありましたら、企画書をお送りします。
    note: 登壇後の名刺交換から個別訪問へ。参加企業は 01_企業マスター に登録する。
  - channel: SNS（準備）
    scene: つながり申請の前に自分のプロフィールを整える
    text: |
      肩書き：企業の従業員向けお金のセミナー講師／ファイナンシャルプランナー（武蔵小金井）
      自己紹介：多摩地域の企業で、新入社員研修・企業型DCの継続投資教育・定年前セミナーを無料でお引き受けしています。
      保険募集は、所属する保険代理店の登録募集人として行います。
      固定投稿：セミナーの様子（写真は許可を得たもの）、参加者アンケートの集計、テーマ一覧。
    note: 保険募集人であることを隠さない。実績のない数字は書かない。
  - channel: SNS（ウォームアップ）
    scene: 申請・DMの前に1〜2週間、相手の投稿に反応する
    text: |
      ・採用広報の投稿へ：「新入社員の方の1日がよく伝わる投稿ですね。研修は4月に集中して実施されるのでしょうか。」
      ・代表の発信へ：「『人が辞めない会社にしたい』というお話に共感しました。多摩で企業向けのお金の研修をしている者です。」
      ・認定・受賞の投稿へ：「認定おめでとうございます。社員の方への取り組みを続けておられるのが伝わります。」
    note: 売り込みは書かない。相手の投稿内容に具体的に触れる。同じ文面を使い回さない。
  - channel: SNS（つながり申請・LinkedIn／Facebook）
    scene: 代表または人事・採用・広報として公に発信している人へ
    text: |
      {{ company }} ○○さま
      はじめまして。武蔵小金井で企業向けのお金の研修をしている{{ me }}と申します。
      ○○さまの「（相手の投稿のテーマ）」の投稿を拝見し、ご連絡しました。
      多摩地域の企業の採用・定着の取り組みを勉強させていただきたく、つながりをお願いできれば幸いです。
    note: 申請文では提案しない。相手の投稿に触れられない場合は申請しない。
  - channel: SNS（承認後の最初のメッセージ）
    scene: つながり承認の当日〜翌日
    text: |
      承認いただきありがとうございます。
      一つだけ教えてください。{{ question }}
      私は企業の従業員向けに、{{ offer_short }}を無料でお引き受けしています。
      もしご関心があれば、A4一枚の概要をお送りします。不要でしたらご放念ください。
    note: "question／offer_short は入口提案ごとに差し替える（例：DC→「DCの投資教育は、導入後どのくらいの頻度で実施されていますか」）。"
  - channel: SNS（X・Instagramの公式アカウント宛てDM）
    scene: 採用広報アカウントがDMを開放している場合のみ
    text: |
      {{ company }} 採用ご担当者さま
      はじめまして。武蔵小金井の{{ my_company }}の{{ me }}と申します。いつも投稿を拝見しています。
      {{ opener }}
      ご担当の方におつなぎいただくか、資料の送り先を教えていただけますと幸いです。
      ※終了後の個別相談で、ご希望の方に限り保険等をご提案する場合があります（購入は任意です）。
      ご不要の場合はご放念ください。再度のご連絡はいたしません。
    note: DMが閉じている・営業お断りの記載がある場合は送らない。1社1通、返信がなければ追わない。
  - channel: SNS（共通の知人への紹介依頼）
    scene: 相手と自分に共通のつながりがいると分かったとき
    text: |
      ○○さん、ご無沙汰しています。お願いがあります。
      {{ company }}の○○さんとつながっておられるのを拝見しました。
      いま、企業の従業員向けに{{ offer_short }}を無料でお引き受けしていて、同社にお役に立てそうだと考えています。
      差し支えなければ、「こういう人がいる」と一言ご紹介いただけないでしょうか。
      ご負担でしたら遠慮なくおっしゃってください。
    note: 共通のつながりは、ご自身がログインした画面でしか確認できない（自動取得はしない）。
  - channel: セミナー実施後
    scene: 入口提案を実施した翌営業日、担当者へ
    text: |
      昨日はお時間をいただきありがとうございました。参加者アンケートの集計をお送りします。
      （参加○名／満足度／「個別に相談したい」と回答された方○名）
      個別相談をご希望の方には、予約ページ（QRコード）からお申し込みいただけるようにします。
      また、今回のような機会を定期的に持てるよう、従業員とご家族がいつでも無料で相談できる窓口を
      福利厚生として常設する形もご用意しています。次回、5分だけご説明の機会をいただけないでしょうか。
    note: ここで初めて「福利厚生FP相談の常設」を提案する。集計は個人が特定されない形のみ。

sns_openers:   # 承認後メッセージの question / offer_short
  dc: {question: 企業型DCの投資教育は、導入後どのくらいの頻度で実施されていますか。, offer_short: 企業型DCの継続投資教育セミナー}
  newhire: {question: 新入社員研修の内容は、毎年いつ頃決めておられますか。, offer_short: 新入社員研修の「給与明細とお金の基礎」1コマ}
  preretire: {question: 定年前の方への退職金や再雇用の説明は、どなたが担当されていますか。, offer_short: 50代向けの定年前ライフプランセミナー}
  safety: {question: 安全大会の講話テーマは、毎年どのように決めておられますか。, offer_short: 安全大会での30分の講話}
  totalreward: {question: 退職金や手当の制度は、社員の方にどのように説明されていますか。, offer_short: 自社制度の価値を伝える社内説明会}
  survey: {question: 従業員の方の満足度や不安を把握するアンケートは実施されていますか。, offer_short: お金の不安を把握する匿名アンケートの無料診断}
  partner: {question: 顧問先から、従業員の定着や福利厚生のご相談を受けられることはありますか。, offer_short: 顧問先の従業員向けセミナー}

# ---- フォーム営業用の短文（課題 → 改善の提案 → 根拠 → 話を聞くと分かること）。本文全体で600字以内に収める ----
# lead_a = 課題から入る文面、lead_b = 相手の得から入る文面（A/Bで反応を比べる）
form_disclosure: "※当日は金融商品のご案内は行いません。終了後、ご希望の方に無料の個別相談をご案内し、その中でご本人が希望された場合に限り保険等をご提案することがあります（購入は任意）。今後のご案内が不要な場合はその旨ご返信ください。以後ご連絡いたしません。"
form:
  dc:
    why_you: 貴社が福利厚生として企業型確定拠出年金を導入されていることを採用情報で拝見し、ご連絡しました。
    lead_a: 企業型DCは加入者への継続投資教育が事業主の努力義務とされていますが、導入時の説明のみになっている会社が少なくありません。
    lead_b: 会社が毎月出している掛金を、社員の方が「福利厚生」として実感できるようにするご提案です。
    offer: 貴社の制度に合わせた継続投資教育セミナー（60分・無料）を代行し、実施記録をお渡しします。ご準備は日程調整のみです。
    learn: 15分のお打ち合わせで、他社の継続教育の実施方法と、貴社の場合の進め方（内容・所要時間）をお伝えします。
  newhire:
    why_you: 貴社が新卒採用に力を入れておられることを採用ページで拝見し、ご連絡しました。
    lead_a: 新入社員は初任給の「手取り」だけで他社と比べがちで、退職金や社会保険料の会社負担など、会社が実際に負担している額は伝わっていません。
    lead_b: 来春の新入社員研修に、準備の手間なく1コマ追加できるご提案です。
    offer: 給与明細の読み方と、貴社の制度の価値を説明する研修1コマ（60分・無料）を担当します。資料は貴社の制度に合わせて当方で作ります。
    learn: 15分のお打ち合わせで、研修の構成案と、貴社の制度を「年間いくら分か」で示す資料の見本をお見せします。
  preretire:
    why_you: 貴社で経験豊富な社員の方が多く活躍されていることを採用サイトで拝見し、ご連絡しました。
    lead_a: 定年が近づくと、退職金の受け取り方・再雇用時の収入・年金について、総務への個別の質問が増えます。
    lead_b: ベテラン社員の方が、定年後の見通しを持って安心して働き続けられるようにするご提案です。
    offer: 50代の方向けに、退職金・再雇用・年金を整理するセミナー（60〜90分・無料）を、貴社の制度に合わせて実施します。
    learn: 15分のお打ち合わせで、セミナーの構成案と、事前に伺う制度の項目をお伝えします。
  safety:
    why_you: 建設・設備工事の現場を支えておられる貴社に、安全大会の講話のご提案でご連絡しました。
    lead_a: 借金や家計の悩みを抱えたままの作業は、注意力の低下や若手の離職につながります。
    lead_b: 次回の安全大会の講話枠を、講師料・交通費なしで埋められるご提案です。
    offer: 「お金の不安と現場の安全」をテーマに、職人の方にも分かる30分の講話を無料でお引き受けします。
    learn: 15分のお打ち合わせで、講話の内容案（3テーマ）をお見せし、貴社の大会の時期に合わせてご提案します。
  totalreward:
    why_you: 貴社が退職金制度をはじめ福利厚生を整えておられることを採用情報で拝見し、ご連絡しました。
    lead_a: 制度が整っていても、社員の多くは毎月の手取りしか見ておらず、会社が負担している額は伝わっていません。
    lead_b: 賃上げをせずに、今すでに払っている報酬の価値を社員に伝えるご提案です。
    offer: 貴社の制度を「年間いくら分の価値か」で社員に説明する会（45分・無料）を実施し、求人票にも使える1枚資料をお渡しします。
    learn: 15分のお打ち合わせで、資料の見本と、貴社の場合の試算の進め方をお伝えします。
  survey:
    why_you: "{{ city }}で事業を営まれている貴社に、従業員アンケートの無料診断のご提案でご連絡しました。"
    lead_a: 離職理由として表に出るのは給与ですが、背景には住宅・教育・老後など会社には言いにくいお金の不安があることが少なくありません。
    lead_b: 従業員の方が何に不安を感じているかを、費用をかけずに数字で把握できるご提案です。
    offer: 匿名5問・所要2分のアンケートを実施し、集計レポート（A4・1枚）を無料でお返しします。診断のみのご利用で構いません。
    learn: 15分のお打ち合わせで、設問とレポートの見本をお見せします。
  partner:
    why_you: "{{ city }}で多くの顧問先を支えておられる貴事務所に、ご相談があり連絡しました。"
    lead_a: 顧問先の経営者から、社員の定着や採用のご相談を受けられることがあるかと存じます。
    lead_b: 貴事務所の顧問先サービスを、費用をかけずに1つ増やせるご提案です。
    offer: 顧問先の従業員向けに、お金のセミナーを無料で提供します。税務は貴事務所、ライフプランと家計は当社という分担で共催できます。
    learn: 30分の情報交換で、共催セミナーのテーマ案と進め方をお伝えします。
