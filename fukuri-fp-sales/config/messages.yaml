# 入口提案ごとの文面と、接点づくり（SNS・紹介）の共通スクリプト。
# すべて下書き。所属代理店の承認後、内容を確認した人が自分で送る。
# 使える差し込み: {{ company }} {{ rep }} {{ dept }} {{ city }} {{ me }}（差出人氏名） {{ my_company }} {{ evidence }}
# 共通ルール: セミナー・講話の中では金融商品を紹介しない。個別相談で本人が希望した場合に提案の可能性があることは必ず書く。

disclosure: "※当日は金融商品のご案内は一切行いません。終了後、ご希望の方には無料の個別相談をご案内します。個別相談の中でご本人が希望された場合に限り、保険等の金融商品をご提案することがあります（購入は任意です）。"

plays:
  dc:
    subject: 確定拠出年金の継続投資教育（無料・60分）お引き受けのご提案
    hook: 貴社の採用情報で、福利厚生として企業型確定拠出年金を導入されていることを拝見しました。
    body: |
      企業型DCを導入されている会社には、加入者への継続的な投資教育が法令上の努力義務とされていますが、
      「導入時に一度説明したきり」「運営管理機関の動画を案内しているだけ」という会社が少なくありません。
      その結果、初期設定のまま運用を見直していない社員の方が多く、会社が出している掛金の価値が伝わりにくくなります。

      そこで、貴社の従業員さま向けに、継続投資教育のセミナー（60分・対面またはオンライン）を無料でお引き受けします。
      ・貴社のDC制度（掛金・商品ラインナップ）に合わせた内容にします
      ・実施記録（日時・参加人数・内容）をお渡しします。継続教育の実施記録としてお使いください
      ・ご準備いただくのは、日程の調整と社内へのご案内だけです
    ask: まずは15分、貴社のDCの現状（加入者数・前回の教育実施時期）を伺えませんか。
    phone: |
      御社が企業型の確定拠出年金を導入されていると拝見しました。
      加入者向けの継続投資教育を、無料で、御社の制度に合わせて60分で代行しております。
      実施記録もお渡しします。前回の投資教育はいつ頃実施されましたでしょうか。
  newhire:
    subject: 来春の新入社員研修「給与明細とお金の基礎」1コマ（無料）のご提案
    hook: 貴社の採用ページで、新卒採用に力を入れておられることを拝見しました。
    body: |
      新入社員は、初任給の「手取り額」だけを見て他社と比べがちです。
      社会保険料の会社負担、退職金、各種手当など、会社が実際に負担している金額はほとんど伝わっていません。

      そこで、来春の新入社員研修の1コマ（60分）を無料でお引き受けします。
      ・給与明細の読み方、社会保険と税金のしくみ
      ・貴社の制度（退職金・手当・休暇など）を「年間いくら分の価値か」で説明
      ・奨学金返済、クレジットカード、NISAなど、社会人1年目のお金の基礎
      資料は当方で用意し、貴社の制度に合わせて作ります。ご担当者さまのご準備は日程の調整だけです。
    ask: 4月の研修内容が固まる前に、15分ほど研修の日程と現在のカリキュラムを伺えませんか。
    phone: |
      来春の新入社員研修の件でお電話しました。
      給与明細の読み方と、御社の制度の価値を新入社員に説明する60分の1コマを、無料で担当しております。
      4月の研修内容は、もうお決まりでしょうか。
  preretire:
    subject: 50代社員向け「定年前ライフプランセミナー」（無料）のご提案
    hook: 貴社の採用サイトで、経験豊富な社員の方が多く活躍されていることを拝見しました。
    body: |
      定年が近づくと、「再雇用で給与はどうなるか」「退職金はいつ・いくら・どう受け取るか」「年金はいつから受け取るか」
      といった質問が総務に集中します。個別に答えるのはご負担が大きく、制度以外の部分は答えにくいものです。

      そこで、50代の社員の方向けに、定年前後のお金を整理するセミナー（60〜90分）を無料でお引き受けします。
      ・退職金の受け取り方と税金、再雇用時の収入と社会保険
      ・公的年金の受給開始時期の考え方
      ・貴社の再雇用制度・退職金制度に合わせた内容にします（事前に規程を伺います）
    ask: 15分ほど、貴社の定年・再雇用制度と、対象となる年代の人数を伺えませんか。
    phone: |
      50代の社員の方向けに、退職金・再雇用・年金を整理するセミナーを無料で実施しております。
      総務の方への個別のご質問を減らすことを目的にした内容です。
      定年前の方への説明は、現在どのようにされていますか。
  safety:
    subject: 安全大会での講話「お金の不安と現場の安全」（無料・30分）のご提案
    hook: 建設・設備工事の現場を支えておられる貴社に、安全大会の講話のご提案です。
    body: |
      安全大会の講話は、毎年のテーマ探しが大変だと伺うことがあります。
      借金や家計の悩みを抱えたままの作業は、注意力の低下や無理な残業につながり、若手の離職の理由にもなります。

      そこで、安全大会または安全衛生協議会の講話枠（30分）を、無料でお引き受けします。
      ・テーマ例：「家計の事故を防ぐ5つの習慣」「給与明細と社会保険、けがで働けないときの備え」
      ・協力会社の職人さん・一人親方の方にも分かる内容にします
      ・講師料・交通費は不要です
    ask: 次回の安全大会の時期と、講話枠のご予定を伺えませんか。
    phone: |
      安全大会の講話の件でお電話しました。
      「お金の不安と現場の安全」をテーマに、30分の講話を無料でお引き受けしております。
      次回の安全大会はいつ頃のご予定でしょうか。講師はもうお決まりですか。
  totalreward:
    subject: 貴社の退職金・福利厚生の価値を社員に伝える説明会（無料・45分）のご提案
    hook: 貴社の採用情報で、退職金制度をはじめ福利厚生を整えておられることを拝見しました。
    body: |
      制度が整っていても、社員の多くは「毎月の手取り」しか見ていません。
      退職金、社会保険料の会社負担、各種手当を合わせると、会社は給与明細の額面よりかなり多くを負担していますが、
      それが伝わらないまま「給料が安い」と他社へ移ってしまうことがあります。

      そこで、貴社の制度を「年間いくら分の価値か」で社員に説明する会（45分）を無料でお引き受けします。
      ・賃上げをせずに、今すでに払っている報酬の価値を伝えられます
      ・求人票や面接での説明にも使える1枚資料をお渡しします
    ask: 15分ほど、貴社の退職金・手当の制度を伺えませんか。
    phone: |
      御社の退職金や手当の制度を、社員の方に「年間いくら分の価値か」で説明する会を、無料で実施しております。
      賃上げをせずに、今の報酬の価値を伝える目的でお使いいただけます。
      制度の社内説明は、現在どなたがされていますか。
  survey:
    subject: 従業員の「お金の不安」無料診断（匿名5問アンケート）のご提案
    hook: "{{ city }}で事業を営まれている貴社に、従業員アンケートの無料診断のご提案です。"
    body: |
      離職の理由として表に出るのは「給与」ですが、その背景には住宅ローン、教育費、老後資金など、
      会社には言いにくいお金の不安があることが少なくありません。

      そこで、従業員の方がお金の何に不安を感じているかを、匿名5問・所要2分のアンケートで無料診断します。
      ・スマートフォンで回答、個人は特定されません
      ・結果は集計レポート（A4・1枚）で貴社にお返しします
      ・健康経営や定着施策を検討する際の基礎資料としてお使いいただけます
      診断だけのご利用で構いません。結果をご覧のうえ、必要であれば社内セミナー等をご提案します。
    ask: 15分ほど、アンケートの設問とレポートの見本をご覧いただけませんか。
    phone: |
      従業員の方がお金の何に不安を感じているかを、匿名5問のアンケートで無料診断しております。
      結果はA4一枚の集計レポートでお返しします。診断だけのご利用で構いません。
      設問とレポートの見本をお送りしてもよろしいでしょうか。
  partner:
    subject: 顧問先の従業員向け「お金のセミナー」共催のご相談
    hook: "{{ city }}で多くの顧問先を支えておられる貴事務所に、ご相談です。"
    body: |
      顧問先の経営者から「社員が辞める」「採用できない」というご相談を受けられることがあるかと存じます。
      当社は、企業の従業員向けに、給与明細・社会保険・老後資金などのセミナーと個別相談を無料で提供しております。

      貴事務所の顧問先サービスの一つとして、次のような形でご一緒できないでしょうか。
      ・顧問先向けの共催セミナー（年末調整・確定申告の時期に合わせた控除の解説など）
      ・顧問先から従業員の福利厚生の相談があった際のご紹介先
      ・貴事務所の職員の方向けの福利厚生としてのご利用
      税務に関する内容は貴事務所にお任せし、当社はライフプランと家計の部分を担当します。
    ask: 30分ほど、情報交換を兼ねてお時間をいただけませんか。
    phone: |
      顧問先の従業員向けに、お金のセミナーを無料で提供しております。
      先生方の顧問先サービスの一つとして、共催セミナーなどでご一緒できないかと考え、お電話しました。
      所長または顧問先支援をご担当の方に、資料をお送りしてもよろしいでしょうか。

