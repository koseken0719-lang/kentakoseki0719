<!doctype html><html lang="ja"><meta charset="utf-8"><body>
<h1>お問い合わせ（テスト用の架空フォーム）</h1>
<form onsubmit="event.preventDefault();document.body.innerHTML='<p>お問い合わせありがとうございました。送信が完了しました。</p>';">
<table>
<tr><th>お問い合わせ種別 <span>必須</span></th><td><select name="type" required><option value="">選択</option><option>製品について</option><option>採用について</option><option>その他</option></select></td></tr>
<tr><th>会社名 <span>必須</span></th><td><input type="text" name="company" required></td></tr>
<tr><th>お名前 <span>必須</span></th><td><input type="text" name="your-name" required></td></tr>
<tr><th>メールアドレス <span>必須</span></th><td><input type="email" name="mail" required></td></tr>
<tr><th>電話番号</th><td><input type="tel" name="tel"></td></tr>
<tr><th>お問い合わせ内容 <span>必須</span></th><td><textarea name="message" required></textarea></td></tr>
</table>
<label><input type="checkbox" name="agree" required> 個人情報の取扱いに同意する</label>
<button type="submit">送信する</button>
</form></body></html>
